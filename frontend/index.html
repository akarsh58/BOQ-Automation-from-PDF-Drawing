<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOQ Automation - Upload Drawing</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 60px auto; text-align: center; }
  .box { border: 2px dashed #888; padding: 40px; border-radius: 10px; }
  button { padding: 10px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
  button:hover { background: #1d4ed8; }
  input[type=number] { padding: 6px; width: 80px; }
  #status { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>
  <h1>BOQ Automation</h1>
  <p>Upload a PDF drawing to generate an editable Bill of Quantities (Excel).</p>
  <div class="box">
    <input type="file" id="fileInput" accept="application/pdf,image/*"><br><br>
    <label>Assumed wall height (m): <input type="number" id="wallHeight" value="3.0" step="0.1"></label><br><br>
    <button onclick="uploadFile()">Generate BOQ</button>
  </div>
  <div id="status"></div>

<script>
async function uploadFile() {
  const fileInput = document.getElementById('fileInput');
  const wallHeight = document.getElementById('wallHeight').value;
  const status = document.getElementById('status');
  if (!fileInput.files.length) { status.innerText = "Please choose a file first."; return; }

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  formData.append('wall_height_m', wallHeight);

  status.innerText = "Processing drawing... this may take a few seconds.";
  try {
    const response = await fetch('http://localhost:8000/generate-boq', { method: 'POST', body: formData });
    if (!response.ok) throw new Error('Server error: ' + response.status);
    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'generated_boq.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.innerText = "Done! BOQ downloaded.";
  } catch (err) {
    status.innerText = "Error: " + err.message;
  }
}
</script>
</body>
</html>
